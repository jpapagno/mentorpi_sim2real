[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mentorpi-nav"
version = "0.1.0"
description = "LiDAR-guided MentorPi control with lightweight planar training and an optional Isaac Lab adapter"
requires-python = ">=3.10"

[project.optional-dependencies]
robot = ["numpy", "pyserial", "torch"]
ssh = ["paramiko"]
media = ["imageio", "imageio-ffmpeg", "Pillow"]
observer = ["opencv-python", "imageio-ffmpeg"]
planar = ["numpy", "torch", "gymnasium>=1,<2", "tensordict", "Pillow", "rsl-rl-lib>=5.5,<6"]

[tool.setuptools.packages.find]
include = ["mentorpi_nav*"]
