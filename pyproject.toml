[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mentorpi-nav"
version = "0.1.0"
description = "Sim-to-real robotics with Isaac Lab training and LiDAR-guided MentorPi control"
requires-python = ">=3.10"

[project.optional-dependencies]
robot = ["numpy", "pyserial", "torch"]
ssh = ["paramiko"]
media = ["imageio", "imageio-ffmpeg", "Pillow"]

[tool.setuptools.packages.find]
include = ["mentorpi_nav*"]
