collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /mentorpi/policy_cmd_vel
    cmd_vel_out_topic: /mentorpi/guarded_cmd_vel
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [BodyStop]
    BodyStop:
      type: polygon
      points: [0.19, 0.19, 0.19, -0.19, -0.19, -0.19, -0.19, 0.19]
      action_type: stop
      max_points: 1
      visualize: true
      polygon_pub_topic: /mentorpi/stop_polygon
      enabled: true
    observation_sources: [scan, depth]
    scan:
      type: scan
      topic: /scan
      enabled: true
    depth:
      type: pointcloud
      topic: /mentorpi/depth_obstacles
      min_height: 0.04
      max_height: 0.5
      enabled: true
